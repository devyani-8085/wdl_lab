<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Portfolio</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html {
      scroll-behavior: smooth;
    }

    /* Custom Styling */
    body {
      background-color: f8f9#fa;
    }

    .hero {
      background: linear-gradient(to right, #007bff, #6610f2);
      color: white;
      padding: 60px 20px;
      border-radius: 10px;
    }

    .card:hover {
      transform: scale(1.05);
      transition: 0.3s;
    }

    footer {
      background: #212529;
    }
  </style>
</head>

<body>

<!-- 🔷 Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">

    <!-- Left Hamburger -->
    <button class="btn btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#menu">
      ☰
    </button>

    <span class="navbar-brand ms-2">My Portfolio</span>

  </div>
</nav>

<!-- 🔷 Offcanvas Menu -->
<div class="offcanvas offcanvas-start bg-dark text-white" id="menu">
  <div class="offcanvas-header">
    <h5 class="text-white">Menu</h5>
    <button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">
    <ul class="nav flex-column">
      <li><a class="nav-link text-white" href="#home">🏠 Home</a></li>
      <li><a class="nav-link text-white" href="#projects">💼 Projects</a></li>
      <li><a class="nav-link text-white" href="#contact">📩 Contact</a></li>
    </ul>
  </div>
</div>

<!-- 🔷 Hero Section -->
<section id="home" class="container mt-4">
  <div class="hero text-center shadow">
  <h1>Hello, I'm Devyani 👋</h1>
  <p>Aspiring Developer | AI Enthusiast</p>
</div>
</section>

<!-- 🔷 Projects Section -->
<section id="projects" class="container mt-5">
  <h2 class="text-center mb-4 text-primary">My Projects</h2>

  <div class="row">

    <div class="col-md-4 mb-3">
      <div class="card shadow border-0">
        <div class="card-body text-center">
          <h5 class="text-primary">Web Development</h5>
          <p>Learn HTML, CSS, Bootstrap</p>
          <button class="btn btn-primary">Read More</button>
        </div>
      </div>
    </div>

    <div class="col-md-4 mb-3">
      <div class="card shadow border-0">
        <div class="card-body text-center">
          <h5 class="text-success">Python</h5>
          <p>Build Python Projects</p>
          <button class="btn btn-success">Explore</button>
        </div>
      </div>
    </div>

    <div class="col-md-4 mb-3">
      <div class="card shadow border-0">
        <div class="card-body text-center">
          <h5 class="text-danger">AI/ML</h5>
          <p>Start AI Journey</p>
          <button class="btn btn-danger">Learn More</button>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- 🔷 Contact Section -->
<section id="contact" class="container mt-5">
  <h2 class="text-center mb-3 text-primary">Contact Us</h2>

  <form class="shadow p-4 bg-white rounded">
    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Enter your name">
    </div>

    <div class="mb-3">
      <input type="email" class="form-control" placeholder="Enter your email">
    </div>

    <div class="mb-3">
      <textarea class="form-control" rows="3" placeholder="Your message"></textarea>
    </div>

    <div class="text-center">
      <button class="btn btn-primary px-4">Submit</button>
    </div>
  </form>
</section>

<!-- 🔷 Footer -->
<footer class="text-white text-center p-3 mt-4">
  <p>© 2026 My Website | Made by Devyani</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
