<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – PM Internship Scheme</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 0.75rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            background: white;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            text-decoration: none;
            min-height: 48px;
        }
        .social-btn:hover { background: #f8fafc; border-color: #94a3b8; }
        .show-pwd { cursor:pointer; user-select:none; color: var(--text-muted); }
        .forgot { font-size: 0.85rem; color: var(--primary); text-decoration: none; }
        .forgot:hover { text-decoration: underline; }
        .register-tab { display: none; }
        .register-tab.show { display: block; }
        .login-tab.show { display: block; }
        .login-tab { display: block; }
        .strength-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 6px; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 2px; transition: all 0.3s; width: 0; }
        .strength-text { font-size: 0.78rem; margin-top: 4px; }
    </style>
</head>
<body>

<header>
    <nav class="nav">
        <a href="index.html" class="nav-logo">
            <div class="logo-icon">PM</div>
            Internship Scheme
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<div class="auth-wrapper">
    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            <div class="logo-big">PM</div>
            <h2>PM Internship Scheme</h2>
            <p>Your gateway to career opportunities</p>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
            <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <div class="login-tab show" id="form-login">
            <!-- Alert placeholder -->
            <div id="login-alert" style="display:none;" class="alert alert-danger">
                <span>⚠️</span> <span id="login-alert-msg"></span>
            </div>

            <div class="form-group">
                <label class="form-label" for="login-email">Email or Mobile Number <span class="required">*</span></label>
                <input type="text" id="login-email" class="form-control" placeholder="Enter your email or mobile" autocomplete="username" />
            </div>

            <div class="form-group">
                <div style="display:flex; justify-content:space-between; margin-bottom:0.45rem;">
                    <label class="form-label" style="margin:0;" for="login-pwd">Password <span class="required">*</span></label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>
                <div style="position:relative;">
                    <input type="password" id="login-pwd" class="form-control" placeholder="Enter your password" autocomplete="current-password" />
                    <span class="show-pwd" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1rem;" onclick="togglePwd('login-pwd', this)">👁️</span>
                </div>
            </div>

            <div style="display:flex; align-items:center; gap:8px; margin-bottom:1.2rem;">
                <input type="checkbox" id="remember" style="width:16px;height:16px;cursor:pointer;" />
                <label for="remember" style="font-size:0.9rem; cursor:pointer;">Remember me</label>
            </div>

            <button class="btn btn-primary btn-full btn-large" onclick="handleLogin()">Login →</button>

            <div class="divider">or continue with</div>

            <div style="display:flex; gap:0.8rem; flex-wrap:wrap;">
                <a href="#" class="social-btn" style="flex:1;" onclick="demoLogin()">🎭 Demo Login</a>
                <a href="#" class="social-btn" style="flex:1;" onclick="alert('Aadhaar login coming soon!')">🪪 Aadhaar</a>
            </div>

            <p style="text-align:center; font-size:0.88rem; margin-top:1.5rem; color:var(--text-muted);">
                Don't have an account?
                <a href="#" style="color:var(--primary); font-weight:600;" onclick="switchTab('register')">Register free</a>
            </p>
        </div>

        <!-- ===== REGISTER FORM ===== -->
        <div class="register-tab" id="form-register">
            <div id="register-alert" style="display:none;" class="alert alert-danger">
                <span>⚠️</span> <span id="register-alert-msg"></span>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem;">
                <div class="form-group">
                    <label class="form-label" for="reg-fname">First Name <span class="required">*</span></label>
                    <input type="text" id="reg-fname" class="form-control" placeholder="First name" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-lname">Last Name <span class="required">*</span></label>
                    <input type="text" id="reg-lname" class="form-control" placeholder="Last name" />
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
                <input type="email" id="reg-email" class="form-control" placeholder="yourname@email.com" autocomplete="email" />
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-mobile">Mobile Number <span class="required">*</span></label>
                <input type="tel" id="reg-mobile" class="form-control" placeholder="10-digit mobile number" maxlength="10" />
            </div>

            <div class="form-group">
                <label class="form-label" for="reg-pwd">Create Password <span class="required">*</span></label>
                <div style="position:relative;">
                    <input type="password" id="reg-pwd" class="form-control" placeholder="Minimum 6 characters"
                           oninput="checkStrength(this.value)" autocomplete="new-password" />
                    <span class="show-pwd" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1rem;" onclick="togglePwd('reg-pwd', this)">👁️</span>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                <div class="strength-text" id="strength-text" style="color:var(--text-muted);"></div>
            </div>

            <div class="form-group" style="display:flex; align-items:flex-start; gap:8px;">
                <input type="checkbox" id="terms" style="width:16px;height:16px;margin-top:3px;cursor:pointer;" />
                <label for="terms" style="font-size:0.85rem; cursor:pointer; color:var(--text-muted);">
                    I agree to the <a href="#" style="color:var(--primary);">Terms & Conditions</a> and
                    <a href="#" style="color:var(--primary);">Privacy Policy</a>
                </label>
            </div>

            <button class="btn btn-primary btn-full btn-large" onclick="handleRegister()">Create Account →</button>

            <p style="text-align:center; font-size:0.88rem; margin-top:1.5rem; color:var(--text-muted);">
                Already have an account?
                <a href="#" style="color:var(--primary); font-weight:600;" onclick="switchTab('login')">Login here</a>
            </p>
        </div>

    </div>
</div>

<script>
/* ===== TAB SWITCHER ===== */
function switchTab(tab) {
    document.getElementById('form-login').style.display    = tab === 'login'    ? 'block' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
}

/* ===== SHOW / HIDE PASSWORD ===== */
function togglePwd(id, icon) {
    const el = document.getElementById(id);
    el.type  = el.type === 'password' ? 'text' : 'password';
    icon.textContent = el.type === 'password' ? '👁️' : '🙈';
}

/* ===== PASSWORD STRENGTH ===== */
function checkStrength(val) {
    const fill = document.getElementById('strength-fill');
    const text = document.getElementById('strength-text');
    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const map = [
        { color:'#ef4444', label:'Very Weak', width:'20%' },
        { color:'#f97316', label:'Weak',      width:'40%' },
        { color:'#eab308', label:'Fair',      width:'60%' },
        { color:'#22c55e', label:'Strong',    width:'80%' },
        { color:'#16a34a', label:'Very Strong', width:'100%' }
    ];
    const s = map[Math.min(score, 4)];
    fill.style.background = s.color;
    fill.style.width      = score === 0 ? '0' : s.width;
    text.style.color      = s.color;
    text.textContent      = score === 0 ? '' : s.label;
}

/* ===== SHOW ALERT ===== */
function showAlert(id, msgId, msg) {
    document.getElementById(id).style.display = 'flex';
    document.getElementById(msgId).textContent = msg;
}

/* ===== LOGIN HANDLER ===== */
function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pwd   = document.getElementById('login-pwd').value.trim();

    document.getElementById('login-alert').style.display = 'none';

    if (!email) { showAlert('login-alert','login-alert-msg','Please enter your email or mobile number.'); return; }
    if (!pwd)   { showAlert('login-alert','login-alert-msg','Please enter your password.'); return; }

    // Check stored user OR demo credentials
    const users = JSON.parse(localStorage.getItem('pm_users') || '[]');
    const found = users.find(u => (u.email === email || u.mobile === email) && u.password === pwd);

    if (found || (email === 'demo' && pwd === 'demo123')) {
        const name = found ? found.firstName : 'Demo User';
        localStorage.setItem('pm_logged_in', JSON.stringify({ name, email }));
        window.location.href = 'form.html';
    } else {
        showAlert('login-alert','login-alert-msg','Invalid credentials. Try demo / demo123 or register first.');
    }
}

/* ===== DEMO LOGIN ===== */
function demoLogin() {
    document.getElementById('login-email').value = 'demo';
    document.getElementById('login-pwd').value   = 'demo123';
    handleLogin();
}

/* ===== REGISTER HANDLER ===== */
function handleRegister() {
    const fname  = document.getElementById('reg-fname').value.trim();
    const lname  = document.getElementById('reg-lname').value.trim();
    const email  = document.getElementById('reg-email').value.trim();
    const mobile = document.getElementById('reg-mobile').value.trim();
    const pwd    = document.getElementById('reg-pwd').value.trim();
    const terms  = document.getElementById('terms').checked;

    document.getElementById('register-alert').style.display = 'none';

    if (!fname || !lname) { showAlert('register-alert','register-alert-msg','Please enter your full name.'); return; }
    if (!email || !email.includes('@')) { showAlert('register-alert','register-alert-msg','Please enter a valid email address.'); return; }
    if (!/^\d{10}$/.test(mobile)) { showAlert('register-alert','register-alert-msg','Mobile number must be 10 digits.'); return; }
    if (pwd.length < 6) { showAlert('register-alert','register-alert-msg','Password must be at least 6 characters.'); return; }
    if (!terms) { showAlert('register-alert','register-alert-msg','Please accept Terms & Conditions to proceed.'); return; }

    const users = JSON.parse(localStorage.getItem('pm_users') || '[]');
    if (users.find(u => u.email === email)) {
        showAlert('register-alert','register-alert-msg','Email already registered. Please login.');
        return;
    }

    users.push({ firstName: fname, lastName: lname, email, mobile, password: pwd });
    localStorage.setItem('pm_users', JSON.stringify(users));
    localStorage.setItem('pm_logged_in', JSON.stringify({ name: fname + ' ' + lname, email }));

    alert('✅ Registration successful! Redirecting to your profile...');
    window.location.href = 'form.html';
}

/* ===== KEY ENTER ===== */
document.addEventListener('keypress', e => {
    if (e.key === 'Enter') {
        const tab = document.getElementById('tab-login').classList.contains('active') ? 'login' : 'register';
        tab === 'login' ? handleLogin() : handleRegister();
    }
});
</script>

</body>
</html>
